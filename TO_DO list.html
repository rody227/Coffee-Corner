<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Steam Coffee - To Do List</title>

    <link rel="stylesheet" href="TO_DO_Design.css">

</head>

<body>

    <div class="container">

        <!-- HEADER -->

        <header>

            <div class="logo">

                ☕ Steam Coffee

            </div>

            <nav>

                <a href="HOME.html">Home</a>

                <a href="TO-DO.html">To-Do List</a>

                <a href="PALETTE.html">Palette Colors</a>

                <a href="TABLE.html">Table</a>

            </nav>

        </header>


        <!-- MAIN -->

        <section class="todo-section">

            <!-- LEFT -->

            <div class="left-side">

                <span class="small-title">
                    Coffee Theme Project
                </span>

                <h1>
                    To-Do List App
                </h1>

                <p>
                    Organize your daily tasks with a beautiful
                    coffee-inspired design using DOM in JavaScript.
                </p>

            </div>


            <!-- RIGHT -->

            <div class="todo-box">

                <h2>
                    Your Tasks
                </h2>

                <div class="input-area">

                    <input type="text"
                           id="taskInput"
                           placeholder="Enter your task...">

                    <button id="addBtn">
                        Add
                    </button>

                </div>

                <div id="taskList"></div>

            </div>

        </section>

    </div>

    <script src="TO-DO.js"></script>

</body>

</html>
